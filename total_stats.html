<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today's Stats Widget</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Georgia, serif;
}

/* Widget Container */
.widget {
  position: relative;
  width: 100%;
  max-width: 900px; /* controls embed size */
  aspect-ratio: 4 / 3;
  margin: auto;
}

/* Image */
.skin-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* Overlay aligned to image */
.stats-overlay {
  position: absolute;

  /* tweak these for pixel-perfect placement */
  top: 30%;
  left: 42%;
  width: 45%;

  display: grid;
  grid-template-columns: repeat(3, 1fr);

  /* spacing scales with container */
  gap: 8%;
}

/* Each number box */
.stat-box {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Numbers scale with container width */
.number {
  font-size: clamp(1rem, 4.5cqw, 3.5rem);
  font-weight: 600;
  color: #2f4a33;
  line-height: 1;
  text-align: center;
}

@media (max-width: 900px) {
  .stats-overlay {
    top: 31%;
    left: 44%;
    width: 41%;
  }

  .number {
    font-size: clamp(1.2rem, 3.5vw, 3rem);
  }
}
</style>
</head>
<body>

<div class="widget">
  <img src="answer_writing.png" alt="Today's Stats Skin" class="skin-image" />

  <div class="stats-overlay">
    <div class="stat-box">
      <div class="number" id="questions">07</div>
    </div>

    <div class="stat-box">
      <div class="number" id="pages">10</div>
    </div>

    <div class="stat-box">
      <div class="number" id="topics">03</div>
    </div>
  </div>
</div>

<script>
/*
BEST SETUP:
GitHub = hosting
Notion = database

Change these values manually first.
Later we can connect directly to Notion API.
*/

/*
Google Sheet Live Connection

Replace the values below later using Google Sheets API / Apps Script URL
This will make the widget auto-update from your personal sheet.
*/

const studyStats = {
  questions: 0,
  pages: 0,
  topics: 0
};

async function fetchSheetData() {
  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbzlPgN5cb6ShIyYwnEaujWjbLbXNtDmbtNpoRGRJF2zPZL3Aanrrwf72V4tY5CYdrUQ/exec");
    const data = await response.json();

    studyStats.questions = data.questions || 0;
    studyStats.pages = data.pages || 0;
    studyStats.topics = data.topics || 0;

    updateWidget();
  } catch (error) {
    console.log("Sheet connection error:", error);
    updateWidget();
  }
}

function updateWidget() {
  document.getElementById('questions').innerText = String(studyStats.questions).padStart(2, '0');
  document.getElementById('pages').innerText = String(studyStats.pages).padStart(2, '0');
  document.getElementById('topics').innerText = String(studyStats.topics).padStart(2, '0');
}

fetchSheetData();
setInterval(fetchSheetData, 60000);
</script>

</body>
</html>
