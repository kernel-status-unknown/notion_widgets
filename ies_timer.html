<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IES Countdown Skin Widget</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: Georgia, serif;
}

.widget {
  position: relative;
  width: 1100px;
  max-width: 95vw;
}

.skin-image {
  width: 100%;
  display: block;
  border-radius: 24px;
}

/* Dynamic countdown placed exactly over the image boxes */
.countdown-overlay {
  position: absolute;
  top: 41%;
  left: 15%;
  width: 40%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.box {
  text-align: center;
  color: #f8f3e8;
  font-weight: 600;
}

.number {
  font-size: 3.2rem;
  line-height: 1;
  text-shadow: 0 2px 8px rgba(0,0,0,0.35);
}

.label {
  margin-top: 10px;
  font-size: 1.1rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

@media (max-width: 900px) {
  .countdown-overlay {
    top: 40%;
    left: 13%;
    width: 44%;
    gap: 10px;
  }

  .number {
    font-size: 2rem;
  }

  .label {
    font-size: 0.7rem;
  }
}
</style>
</head>
<body>

<div class="widget">
  <img
    src="ies_coundown_timer.png"
    alt="IES Countdown Background"
    class="skin-image"
  />

  <div class="countdown-overlay">
    <div class="box">
      <div class="number" id="days">128</div>
      <div class="label">Days</div>
    </div>

    <div class="box">
      <div class="number" id="hours">14</div>
      <div class="label">Hours</div>
    </div>

    <div class="box">
      <div class="number" id="minutes">36</div>
      <div class="label">Minutes</div>
    </div>

    <div class="box">
      <div class="number" id="seconds">42</div>
      <div class="label">Seconds</div>
    </div>
  </div>
</div>

<script>
const examDate = new Date("2026-06-20T09:00:00").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const gap = examDate - now;

  if (gap <= 0) {
    document.getElementById("days").innerText = "00";
    document.getElementById("hours").innerText = "00";
    document.getElementById("minutes").innerText = "00";
    document.getElementById("seconds").innerText = "00";
    return;
  }

  const days = Math.floor(gap / (1000 * 60 * 60 * 24));
  const hours = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((gap % (1000 * 60)) / 1000);

  document.getElementById("days").innerText = String(days).padStart(2, '0');
  document.getElementById("hours").innerText = String(hours).padStart(2, '0');
  document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
  document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
