<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IES Countdown Skin Widget</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  width: 100%;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

/* Main Widget Container */
.widget {
  position: relative;
  width: 100%;
  max-width: 1600px; /* keeps it elegant on large screens */
  aspect-ratio: 16 / 9; /* adaptive to 16:9 image */
  margin: auto;
}

/* Background Image */
.skin-image {
  width: 100%;
  height: 100%;
  object-fit: contain; /* keeps exact image ratio */
  display: block;
  border-radius: 0;
}

/* Countdown positioned over image */
.countdown-overlay {
  position: absolute;

  /* Adjust these 3 values for placement */
  top: 40%;
  left: 10%;
  width: 42%;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

/* Individual Countdown Boxes */
.box {
  background: rgba(35, 52, 40, 0.82);
  border-radius: 16px;
  padding: 14px 8px;
  min-height: 100px;
  text-align: center;
  color: #f8f3e8;
  font-weight: 600;
  backdrop-filter: blur(4px);
}

/* Numbers */
.number {
  font-size: clamp(2.5rem, 3vw, 4rem); /* increased size */
  line-height: 2;
  text-shadow: 0 2px 8px rgba(0,0,0,0.35);
}

/* Labels */
.label {
  margin-top: 8px;
  font-size: clamp(1rem, 1.3vw, 1.5rem); /* increased size */
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

/* Tablet */
@media (max-width: 1024px) {
  .countdown-overlay {
    top: 36%;
    left: 13%;
    width: 46%;
    gap: 10px;
  }

  .box {
    padding: 12px 6px;
    min-height: 60px;
  }
}

/* Mobile */
@media (max-width: 768px) {
  .widget {
    width: 100%;
    aspect-ratio: 16 / 9;
  }

  .countdown-overlay {
    top: 35%;
    left: 10%;
    width: 55%;
    gap: 8px;
  }

  .box {
    border-radius: 10px;
    padding: 8px 4px;
    min-height: 48px;
  }

  .label {
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
}
</style>
</head>
<body>

<div class="widget">
  <img
    src="iesfinalcountdown.png"
    alt="IES Countdown Background"
    class="skin-image"
  />

  <div class="countdown-overlay">

    <div class="box">
      <div class="number" id="days">00</div>
      <div class="label">Days</div>
    </div>

    <div class="box">
      <div class="number" id="hours">00</div>
      <div class="label">Hours</div>
    </div>

    <div class="box">
      <div class="number" id="minutes">00</div>
      <div class="label">Minutes</div>
    </div>

    <div class="box">
      <div class="number" id="seconds">00</div>
      <div class="label">Seconds</div>
    </div>

  </div>
</div>

<script>
const examDate = new Date("2026-06-20T09:00:00").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const gap = examDate - now;

  if (gap <= 0) {
    document.getElementById("days").innerText = "00";
    document.getElementById("hours").innerText = "00";
    document.getElementById("minutes").innerText = "00";
    document.getElementById("seconds").innerText = "00";
    return;
  }

  const days = Math.floor(gap / (1000 * 60 * 60 * 24));
  const hours = Math.floor(
    (gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
  );
  const minutes = Math.floor(
    (gap % (1000 * 60 * 60)) / (1000 * 60)
  );
  const seconds = Math.floor(
    (gap % (1000 * 60)) / 1000
  );

  document.getElementById("days").innerText =
    String(days).padStart(2, "0");

  document.getElementById("hours").innerText =
    String(hours).padStart(2, "0");

  document.getElementById("minutes").innerText =
    String(minutes).padStart(2, "0");

  document.getElementById("seconds").innerText =
    String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
