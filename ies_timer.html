<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IES Countdown Skin Widget</title>

<!-- Replace only the CSS part with this improved adaptive version -->

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  width: 100%;
  font-family: Georgia, serif;
  overflow-x: hidden;
}

/* Main Widget */
.widget {
  position: relative;
  width: min(100vw, 1600px);
  aspect-ratio: 16 / 9; /* fixed to your image ratio */
  margin: auto;
}

/* Background Image */
.skin-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  border-radius: 0;
}

/* Countdown Overlay */
.countdown-overlay {
  position: absolute;

  /* these scale with image automatically */
  top: 45%;
  left: 10%;
  width: 42%;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1vw; /* scales with screen */
}

/* Countdown Boxes */
.box {
  background: rgba(35, 52, 40, 0.82);
  border-radius: 0.9vw;
  padding: 1vw 0.5vw;
  min-height: 6vw;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  color: #f8f3e8;
  font-weight: 600;
  backdrop-filter: blur(4px);
}

/* Timer Numbers */
.number {
  font-size: clamp(1.2rem, 2.5vw, 3.6rem);
  line-height: 1;
  text-shadow: 0 2px 8px rgba(0,0,0,0.35);
}

/* Labels */
.label {
  margin-top: 0.5vw;
  font-size: clamp(0.6rem, 0.9vw, 1.2rem);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

/* Tablet */
@media (max-width: 1024px) {
  .countdown-overlay {
    top: 35%;
    left: 10%;
    width: 46%;
  }

  .box {
    min-height: 7vw;
  }
}

/* Mobile */
@media (max-width: 768px) {
  .countdown-overlay {
    top: 34%;
    left: 9%;
    width: 55%;
    gap: 0.8vw;
  }

  .box {
    min-height: 8vw;
    border-radius: 1vw;
  }

  .number {
    font-size: clamp(0.9rem, 2.2vw, 2rem);
  }

  .label {
    font-size: clamp(0.45rem, 0.7vw, 0.8rem);
  }
}
</style>
</head>
<body>

<div class="widget">
  <img
    src="iesfinalcountdown.png"
    alt="IES Countdown Background"
    class="skin-image"
  />

  <div class="countdown-overlay">

    <div class="box">
      <div class="number" id="days">00</div>
      <div class="label">Days</div>
    </div>

    <div class="box">
      <div class="number" id="hours">00</div>
      <div class="label">Hours</div>
    </div>

    <div class="box">
      <div class="number" id="minutes">00</div>
      <div class="label">Minutes</div>
    </div>

    <div class="box">
      <div class="number" id="seconds">00</div>
      <div class="label">Seconds</div>
    </div>

  </div>
</div>

<script>
const examDate = new Date("2026-06-20T09:00:00").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const gap = examDate - now;

  if (gap <= 0) {
    document.getElementById("days").innerText = "00";
    document.getElementById("hours").innerText = "00";
    document.getElementById("minutes").innerText = "00";
    document.getElementById("seconds").innerText = "00";
    return;
  }

  const days = Math.floor(gap / (1000 * 60 * 60 * 24));
  const hours = Math.floor(
    (gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
  );
  const minutes = Math.floor(
    (gap % (1000 * 60 * 60)) / (1000 * 60)
  );
  const seconds = Math.floor(
    (gap % (1000 * 60)) / 1000
  );

  document.getElementById("days").innerText =
    String(days).padStart(2, "0");

  document.getElementById("hours").innerText =
    String(hours).padStart(2, "0");

  document.getElementById("minutes").innerText =
    String(minutes).padStart(2, "0");

  document.getElementById("seconds").innerText =
    String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
